<script>
    function tryNextImg(img, fallbacks) {
      if (!img.dataset.step) img.dataset.step = 0;
      let step = parseInt(img.dataset.step);
      if (step < fallbacks.length) {
        img.dataset.step = step + 1;
        img.src = fallbacks[step];
      }
    }

    let audioCtx = null;
    let isSynthRunning = false;
    let synthInterval = null;
    const streamAudio = document.getElementById('external-audio');

    function initAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.log("AudioContext not supported or blocked");
      }
    }

    function updateAudioButton(isPlaying) {
      const label = document.getElementById('audio-label');
      const glyph = document.getElementById('audio-glyph');
      if (label) label.innerText = isPlaying ? "Pause" : "Play Music";
      if (glyph) glyph.innerText = isPlaying ? "❚❚" : "♪";
    }

    function startSyntheticMusic() {
      initAudioContext();
      if (!audioCtx) return;

      isSynthRunning = true;
      updateAudioButton(true);

      const chords = [
        [146.83, 293.66, 369.99, 440.00, 587.33],
        [110.00, 220.00, 277.18, 329.63, 440.00],
        [123.47, 246.94, 293.66, 369.99, 440.00],
        [98.00, 196.00, 246.94, 293.66, 392.00]
      ];

      let step = 0;
      function playStep() {
        if (!isSynthRunning || !audioCtx) return;
        const chord = chords[step % chords.length];
        const now = audioCtx.currentTime;

        try {
          const bassOsc = audioCtx.createOscillator();
          const bassGain = audioCtx.createGain();
          bassOsc.type = 'triangle';
          bassOsc.frequency.setValueAtTime(chord[0], now);

          bassGain.gain.setValueAtTime(0.0001, now);
          bassGain.gain.linearRampToValueAtTime(0.12, now + 0.3);
          bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

          bassOsc.connect(bassGain);
          bassGain.connect(audioCtx.destination);
          bassOsc.start(now);
          bassOsc.stop(now + 3.0);
        } catch(e) {}

        step++;
      }

      playStep();
      if (synthInterval) clearInterval(synthInterval);
      synthInterval = setInterval(playStep, 2400);
    }

    function stopSyntheticMusic() {
      isSynthRunning = false;
      if (synthInterval) clearInterval(synthInterval);
      updateAudioButton(false);
    }

    function playAudioMaster() {
      initAudioContext();
      startSyntheticMusic();

      if (streamAudio) {
        streamAudio.volume = 0.9;
        streamAudio.play().then(() => {
          stopSyntheticMusic();
          updateAudioButton(true);
        }).catch((err) => {
          console.log("Using synthetic audio engine:", err);
        });
      }
    }

    function unveilRoyalExperience() {
      try {
        playAudioMaster();
      } catch (e) {
        console.log("Audio error bypassed:", e);
      }
      const proscenium = document.getElementById('proscenium');
      if (proscenium) {
        proscenium.classList.add('opened');
      }
    }

    function toggleAudioSystem() {
      initAudioContext();
      if (streamAudio && !streamAudio.paused) {
        streamAudio.pause();
        updateAudioButton(false);
      } else if (isSynthRunning) {
        stopSyntheticMusic();
      } else {
        playAudioMaster();
      }
    }

    window.addEventListener('touchstart', initAudioContext, { once: true });
    window.addEventListener('click', initAudioContext, { once: true });

    // Canvas & Observer code remains same...
  </script>
