<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Royal Union — Akhil & Nandhini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@200;300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    :root {
      --night-velvet: #0a0103;
      --maroon-deep: #190206;
      --maroon-rich: #3f060f;
      --maroon-glow: #700f1c;
      --gold-deep: #946e25;
      --gold-24k: #d8b257;
      --gold-bright: #fae9a8;
      --gold-foil: linear-gradient(135deg, #9b701e 0%, #fae9a8 28%, #d8b257 52%, #fff5dc 74%, #7d540f 100%);
      --champagne-silk: #fbf7ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      background-color: var(--night-velvet);
      color: var(--champagne-silk);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* 1. ROYAL VELVET PROSCENIUM CURTAIN & KNOT */
    #proscenium {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b0205 0%, #050001 100%);
      overflow: hidden;
      perspective: 1600px;
      transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1) 0.8s, visibility 1.2s 0.8s;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.5%;
      height: 100%;
      background: repeating-linear-gradient(90deg, 
        #0c0103 0px, 
        #220307 28px, 
        #44070e 58px, 
        #630d17 88px, 
        #180205 120px
      );
      box-shadow: inset 0 0 160px rgba(0,0,0,0.98);
      transition: transform 2.2s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 10;
    }

    .curtain-left {
      left: 0;
      transform-origin: left center;
      border-right: 3px solid var(--gold-24k);
    }

    .curtain-right {
      right: 0;
      transform-origin: right center;
      border-left: 3px solid var(--gold-24k);
    }

    .knot-cord-wrap {
      position: relative;
      z-index: 30;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-tap-highlight-color: transparent;
    }

    .knot-cord-wrap:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 35px rgba(250, 233, 168, 0.75));
    }

    .suspender-cord {
      width: 6px;
      height: 95px;
      background: repeating-linear-gradient(45deg, #8a6519, #fae9aa 4px, #583f0d 8px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.85);
    }

    .bow-assembly {
      position: relative;
      width: 110px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bow-center-seal {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7db, var(--gold-24k) 60%, #463107);
      border: 1.5px solid #2f2003;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #7a1220;
    }

    .bow-wing {
      position: absolute;
      width: 50px;
      height: 34px;
      border: 4.5px solid #e5c36a;
      border-radius: 50% 50% 40% 40%;
      top: 12px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), 0 8px 18px rgba(0,0,0,0.65);
    }
    .wing-left { left: 4px; transform: rotate(-24deg); }
    .wing-right { right: 4px; transform: rotate(24deg); }

    .tassel-bobs {
      display: flex;
      gap: 22px;
      margin-top: -6px;
    }

    .tassel-string {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: swingStrand 3.4s ease-in-out infinite alternate;
    }
    .tassel-string:nth-child(2) {
      animation-delay: -1.7s;
    }

    @keyframes swingStrand {
      0% { transform: rotate(8deg); }
      100% { transform: rotate(-8deg); }
    }

    .bead-wire { width: 3px; height: 38px; background: #caa049; }
    .metal-bead {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf4, var(--gold-24k) 60%, #463107);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      margin: 2px 0;
    }
    .bullion-tassel {
      width: 17px;
      height: 56px;
      background: linear-gradient(180deg, var(--gold-24k), #4e3305);
      border-radius: 2px 2px 14px 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.65);
    }

    .invitation-prompt {
      margin-top: 2rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.74rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #fae9aa;
      text-shadow: 0 2px 14px rgba(0,0,0,0.9);
      animation: pulseCaption 2.4s infinite ease-in-out;
    }

    @keyframes pulseCaption {
      0%, 100% { opacity: 0.55; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    #proscenium.opened .curtain-left { transform: translateX(-105%) skewY(-2deg); }
    #proscenium.opened .curtain-right { transform: translateX(105%) skewY(2deg); }
    #proscenium.opened .knot-cord-wrap {
      opacity: 0;
      transform: translateY(50px) scale(0.4);
      pointer-events: none;
    }
    #proscenium.opened {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 2. SCENIC VIEWPORT */
    .viewport-scene {
      position: relative;
      z-index: 3;
      max-width: 1080px;
      margin: 0 auto;
      padding: 4rem 1.2rem;
    }

    .gold-divider-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 1.6rem auto;
      max-width: 360px;
    }

    .gold-divider-rule .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-24k), transparent);
    }

    .gold-divider-rule .glyph {
      color: var(--gold-bright);
      font-size: 1.1rem;
    }

    .scene-reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .scene-reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-chamber {
      text-align: center;
      padding: 2.5rem 0.5rem;
      position: relative;
    }

    .regal-crest {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.8rem;
      border: 1.5px solid var(--gold-24k);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 30px rgba(216, 178, 87, 0.3);
      background: radial-gradient(circle, #2a050b 0%, #0d0103 100%);
    }

    .regal-crest span {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-bright);
    }

    .scripture-lead {
      font-size: clamp(1.15rem, 3.5vw, 1.5rem);
      font-style: italic;
      color: #fffaf0;
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.3px;
      max-width: 820px;
      margin: 0 auto;
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
      white-space: pre-line;
    }

    .scripture-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-bright);
      font-weight: 600;
      margin-top: 0.8rem;
      margin-bottom: 1.8rem;
    }

    .script-subheading {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(2.8rem, 8vw, 3.8rem);
      color: var(--gold-24k);
      line-height: 1.1;
      margin-bottom: 0.8rem;
    }

    .petition-prose {
      font-size: clamp(1.15rem, 3.8vw, 1.35rem);
      font-style: italic;
      color: #d1c0bd;
      line-height: 1.75;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 0.5rem;
    }

    .names-monolith {
      text-align: center;
      margin: 4.5rem 0;
      padding: 3.5rem 1.2rem;
      background: radial-gradient(circle at center, #26040a 0%, #0d0103 100%);
      border-top: 1px solid rgba(216, 178, 87, 0.4);
      border-bottom: 1px solid rgba(216, 178, 87, 0.4);
    }

    .name-marquee {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.6rem, 5.5vw, 3rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      line-height: 1.3;
      display: inline-block;
      background: linear-gradient(90deg, #d8b257 0%, #fff5dc 30%, #fae9a8 50%, #d8b257 80%, #fff5dc 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px rgba(216, 178, 87, 0.35));
      animation: goldLustre 5s linear infinite;
    }

    @keyframes goldLustre {
      to { background-position: 200% center; }
    }

    .parental-tribute {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      color: var(--champagne-silk);
      line-height: 1.55;
      font-weight: 400;
      max-width: 620px;
      margin: 0.6rem auto 0;
      padding: 0 0.5rem;
    }

    .sacred-intertwine {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(3rem, 8vw, 4.2rem);
      color: var(--gold-bright);
      margin: 1.2rem 0;
      display: block;
    }

    /* HEART BLESSING */
    .blessing-sanctuary {
      text-align: center;
      margin: 4rem 0;
      padding: 2.5rem 1.2rem;
      background: radial-gradient(circle at center, #230409 0%, #0e0103 100%);
      border: 1px dashed var(--gold-24k);
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    }

    .heart-pulse-btn {
      background: none;
      border: none;
      font-size: 4rem;
      cursor: pointer;
      color: #d12338;
      display: inline-block;
      transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      filter: drop-shadow(0 8px 22px rgba(209, 35, 56, 0.5));
    }

    .heart-pulse-btn:active {
      transform: scale(0.85);
    }

    .heart-label {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 700;
      color: var(--gold-bright);
      margin-top: 0.4rem;
      letter-spacing: 1.5px;
    }

    .floating-blessing-glyph {
      position: fixed;
      pointer-events: none;
      z-index: 100000;
      font-size: 2rem;
      animation: floatAscend 2.5s ease-out forwards;
    }

    @keyframes floatAscend {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--drift-x), -520px) scale(1.4) rotate(var(--spin)); }
    }

    /* COUNTDOWN & CALENDAR */
    .chronometer-vault {
      text-align: center;
      margin: 4.5rem 0;
      padding: 3rem 1.2rem;
      background: radial-gradient(circle at center, #28040a 0%, #0d0103 100%);
      border: 1.5px solid var(--gold-24k);
      border-radius: 24px;
      color: #fff;
      box-shadow: 0 20px 55px rgba(0,0,0,0.6);
    }

    .chronometer-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.4rem, 4.8vw, 1.9rem);
      color: #ffd97d;
      margin-bottom: 0.5rem;
      letter-spacing: 1.5px;
    }

    .chronometer-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.76rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d8ccc7;
      margin-bottom: 2rem;
    }

    .digits-matrix {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      max-width: 480px;
      margin: 0 auto 2.2rem;
    }

    .digit-cell {
      background: rgba(255, 255,
